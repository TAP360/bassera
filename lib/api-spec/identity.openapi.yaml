openapi: 3.0.3
info:
  title: Identity
  version: 1.0.0
  description: External consumer mobile login API supplied by the project owner.
paths:
  /v1/identity/auth/refresh:
    post:
      operationId: refreshConsumerSession
      description: Public endpoint. Rotates refresh tokens; the previous token is revoked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: New flat access/refresh token pair with the same user identity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerTokens"
        "400":
          description: INVALID_REFRESH_TOKEN or ACCOUNT_NOT_ACTIVE.
  /v1/identity/consumer/auth/register:
    post:
      operationId: registerConsumer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerRegistrationInput"
      responses:
        "201":
          description: Pending account; verify the registration OTP before authentication.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerRegistrationResult"
  /v1/identity/consumer/auth/verify-otp:
    post:
      operationId: verifyConsumerRegistrationOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerRegistrationVerificationInput"
      responses:
        "200":
          description: Flat authenticated session, not a nested login outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerTokens"
  /v1/identity/consumer/auth/login:
    post:
      operationId: loginConsumer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerEmailLoginInput"
      responses:
        "200":
          description: Nested tokens or an MFA requirement and userId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerificationResult"
  /v1/identity/consumer/auth/mfa/challenge:
    post:
      operationId: challengeConsumerMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerMfaChallengeInput"
      responses:
        "200":
          description: Flat authenticated session after TOTP validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerTokens"
  /v1/identity/consumer/auth/mfa/recovery:
    post:
      operationId: recoverConsumerMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerMfaRecoveryInput"
      responses:
        "200":
          description: Flat authenticated session after consuming a recovery code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerTokens"
  /v1/identity/consumer/auth/phone/validate:
    post:
      operationId: validateConsumerPhone
      summary: Validate a local mobile number and return its canonical E.164 value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneValidationInput"
      responses:
        "200":
          description: Phone validity; invalid numbers have no e164 value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneValidationResult"
  /v1/identity/consumer/auth/otp/request:
    post:
      operationId: requestConsumerOtp
      summary: Request or resend an OTP; the same endpoint handles login and signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestInput"
      responses:
        "202":
          description: Code requested; delivery depends on the identity service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResult"
  /v1/identity/consumer/auth/otp/email/request:
    post:
      operationId: requestConsumerEmailOtp
      summary: Request or resend an email OTP; the same endpoint handles login and signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailOtpRequestInput"
      responses:
        "202":
          description: Code requested; delivery depends on the identity service.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResult"
  /v1/identity/consumer/auth/otp/verify:
    post:
      operationId: verifyConsumerOtp
      summary: Verify a phone or email OTP and return a session or an MFA requirement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerificationInput"
      responses:
        "200":
          description: Verified session, or MFA requirement without tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerificationResult"
  /v1/identity/consumer/me:
    put:
      operationId: updateCurrentConsumer
      summary: Partially update supported consumer profile fields; phone/email are immutable here.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsumerProfileUpdateInput"
      responses:
        "200":
          description: Updated consumer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerProfile"
    get:
      operationId: getCurrentConsumer
      summary: Get the authenticated consumer profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated consumer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumerProfile"
  /v1/profile/consumer-apis/questionnaires/{code}:
    get:
      operationId: getConsumerQuestionnaire
      summary: Get a published questionnaire (dimensions, questions, answer options) by code
      security:
        - bearerAuth: []
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
          example: MONEY_ATTITUDE
      responses:
        "200":
          description: Questionnaire definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Questionnaire"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ConsumerProfileUpdateInput:
      type: object
      properties:
        name:
          type: string
          nullable: true
        language:
          type: string
          nullable: true
        halalMode:
          type: boolean
          nullable: true
    ConsumerRegistrationInput:
      type: object
      required: [email, password, businessCode]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        businessCode:
          type: string
        phone:
          type: string
        name:
          type: string
    ConsumerRegistrationResult:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
        message:
          type: string
    ConsumerRegistrationVerificationInput:
      type: object
      required: [userId, otp]
      properties:
        userId:
          type: string
        otp:
          type: string
    ConsumerEmailLoginInput:
      type: object
      required: [email, password, businessCode]
      properties:
        email:
          type: string
        password:
          type: string
        businessCode:
          type: string
    ConsumerMfaChallengeInput:
      type: object
      required: [userId, totpCode]
      properties:
        userId:
          type: string
        totpCode:
          type: string
    ConsumerMfaRecoveryInput:
      type: object
      required: [userId, recoveryCode]
      properties:
        userId:
          type: string
        recoveryCode:
          type: string
    PhoneValidationInput:
      type: object
      required: [countryCode, phone]
      properties:
        countryCode:
          type: string
        phone:
          type: string
    PhoneValidationResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        e164:
          type: string
    OtpRequestInput:
      type: object
      required: [businessCode, phone, language]
      properties:
        businessCode:
          type: string
        phone:
          type: string
        language:
          type: string
          enum: [ar, en]
    OtpRequestResult:
      type: object
      required: [expiresIn, resendAfter]
      properties:
        expiresIn:
          type: integer
        resendAfter:
          type: integer
    EmailOtpRequestInput:
      type: object
      required: [businessCode, email]
      properties:
        businessCode:
          type: string
        email:
          type: string
    PhoneOtpVerificationInput:
      type: object
      required: [businessCode, phone, otp]
      properties:
        businessCode:
          type: string
        phone:
          type: string
        otp:
          type: string
    EmailOtpVerificationInput:
      type: object
      required: [businessCode, email, otp]
      properties:
        businessCode:
          type: string
        email:
          type: string
        otp:
          type: string
    OtpVerificationInput:
      oneOf:
        - $ref: "#/components/schemas/PhoneOtpVerificationInput"
        - $ref: "#/components/schemas/EmailOtpVerificationInput"
    ConsumerTokens:
      type: object
      required: [accessToken, refreshToken, userId, userType, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        userId:
          type: string
        userType:
          type: string
        expiresIn:
          type: integer
    OtpVerificationResult:
      type: object
      required: [mfaRequired]
      properties:
        newUser:
          type: boolean
        mfaRequired:
          type: boolean
        userId:
          type: string
        tokens:
          $ref: "#/components/schemas/ConsumerTokens"
    ConsumerProfile:
      type: object
      required: [id]
      properties:
        id:
          type: string
        email:
          type: string
          nullable: true
        businessId:
          type: string
        name:
          type: string
          nullable: true
        language:
          type: string
        halalMode:
          type: boolean
        preferences:
          type: string
          nullable: true
        accountStatus:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
        demographics:
          type: object
          nullable: true
          additionalProperties: true
    LocalizedText:
      type: object
      required: [en]
      properties:
        en:
          type: string
        ar:
          type: string
    QuestionnaireAnswerOption:
      type: object
      required: [value, label]
      properties:
        value:
          type: number
        label:
          $ref: "#/components/schemas/LocalizedText"
    QuestionnaireAnswerSchema:
      type: object
      required: [type, options]
      properties:
        type:
          type: string
        name:
          type: string
        description:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/QuestionnaireAnswerOption"
    QuestionnaireQuestion:
      type: object
      required: [id, key, displayOrder, question, questionType, answerSchema]
      properties:
        id:
          type: string
        key:
          type: string
        dimensionKey:
          type: string
          nullable: true
        displayOrder:
          type: number
        question:
          $ref: "#/components/schemas/LocalizedText"
        questionType:
          type: string
        answerSchema:
          $ref: "#/components/schemas/QuestionnaireAnswerSchema"
        reverseScored:
          type: boolean
        scoreWeight:
          type: number
        active:
          type: boolean
    QuestionnaireDimension:
      type: object
      required: [id, key, label, displayOrder, questions]
      properties:
        id:
          type: string
        key:
          type: string
        label:
          $ref: "#/components/schemas/LocalizedText"
        profileName:
          $ref: "#/components/schemas/LocalizedText"
        populationAverage:
          type: number
        narrativeHigh:
          $ref: "#/components/schemas/LocalizedText"
        narrativeModerate:
          $ref: "#/components/schemas/LocalizedText"
        narrativeLow:
          $ref: "#/components/schemas/LocalizedText"
        displayOrder:
          type: number
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionnaireQuestion"
    Questionnaire:
      type: object
      required: [id, code, name, version, dimensions]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          $ref: "#/components/schemas/LocalizedText"
        version:
          type: number
        scoreHighThreshold:
          type: number
        scoreModerateThreshold:
          type: number
        dimensions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionnaireDimension"
        undimensionedQuestions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionnaireQuestion"
